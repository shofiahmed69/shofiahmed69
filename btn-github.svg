<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 54" width="100%" height="100%">
  <defs>
    <linearGradient id="btn_gh_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .arrow-nudge { animation: nudge 1.8s infinite ease-in-out; }
  </style>
  <rect x="1" y="1" width="438" height="52" rx="10" fill="#131726" stroke="url(#btn_gh_grad)" stroke-width="1.2"/>
  <text x="18" y="33" font-size="18">🐙</text>
  <text x="48" y="32" fill="#ffffff" font-size="14" class="sans" font-weight="700">GitHub</text>
  <text x="106" y="32" fill="#94a3b8" font-size="12" class="mono">github.com/shofiahmed69</text>
  <g class="arrow-nudge">
    <text x="406" y="34" fill="#fbbf24" font-size="17" font-weight="700">→</text>
  </g>
</svg>