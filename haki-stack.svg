<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="stack_border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="stack_sun_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="stack_core_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="stack_grid_dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes orbit_spin { 100% { transform: rotate(360deg); } }
    @keyframes orbit_rev { 100% { transform: rotate(-360deg); } }
    @keyframes chip_glow {
      0%, 100% { border-color: rgba(56, 189, 248, 0.3); stroke: rgba(56, 189, 248, 0.4); }
      50% { border-color: rgba(251, 191, 36, 0.8); stroke: rgba(251, 191, 36, 0.8); }
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="916" height="436" rx="16" fill="#0d0e16" stroke="url(#stack_border_grad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="436" rx="16" fill="url(#stack_grid_dots)"/>

  <!-- Left Side: Tech Orbiting Universe (Center 200, 220) -->
  <g transform="translate(190, 220)">
    <!-- Sun God / Nika Core -->
    <circle cx="0" cy="0" r="32" fill="url(#stack_sun_core)" filter="url(#stack_core_glow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#78350f" font-size="14" class="sans" font-weight="900">NIKA</text>
    <text x="0" y="20" text-anchor="middle" fill="#78350f" font-size="8" class="mono" font-weight="700">CORE</text>

    <!-- Orbit 1 (Ellipse, tilted -25 deg) -->
    <g transform="rotate(-25)">
      <ellipse cx="0" cy="0" rx="145" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
      <!-- Icon 1: Flutter -->
      <g>
        <animateMotion path="M -145 0 A 145 60 0 1 0 145 0 A 145 60 0 1 0 -145 0" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" class="mono" font-weight="700">FLT</text>
      </g>
      <!-- Icon 2: React -->
      <g>
        <animateMotion path="M 145 0 A 145 60 0 1 0 -145 0 A 145 60 0 1 0 145 0" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="9" class="mono" font-weight="700">RCT</text>
      </g>
    </g>

    <!-- Orbit 2 (Ellipse, tilted 35 deg) -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="155" ry="65" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
      <!-- Icon 3: TypeScript -->
      <g>
        <animateMotion path="M -155 0 A 155 65 0 1 0 155 0 A 155 65 0 1 0 -155 0" dur="15s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" class="mono" font-weight="700">TS</text>
      </g>
      <!-- Icon 4: Python -->
      <g>
        <animateMotion path="M 155 0 A 155 65 0 1 0 -155 0 A 155 65 0 1 0 155 0" dur="15s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#854d0e" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" class="mono" font-weight="700">PY</text>
      </g>
    </g>

    <!-- Orbit 3 (Ellipse, tilted 85 deg) -->
    <g transform="rotate(85)">
      <ellipse cx="0" cy="0" rx="160" ry="65" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
      <!-- Icon 5: Dart -->
      <g>
        <animateMotion path="M -160 0 A 160 65 0 1 0 160 0 A 160 65 0 1 0 -160 0" dur="18s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" class="mono" font-weight="700">DART</text>
      </g>
      <!-- Icon 6: Firebase -->
      <g>
        <animateMotion path="M 160 0 A 160 65 0 1 0 -160 0 A 160 65 0 1 0 160 0" dur="18s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#9a3412" stroke="#fb923c" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" class="mono" font-weight="700">FIRE</text>
      </g>
    </g>

    <text x="0" y="195" text-anchor="middle" fill="#94a3b8" font-size="11" class="mono">
      ⚡ SUN GOD REVOLUTION CORE
    </text>
  </g>

  <!-- Right Side: Categorized Chip Grid -->
  <g transform="translate(415, 30)">
    <text x="0" y="16" fill="#06b6d4" font-size="12" class="mono" font-weight="700" letter-spacing="1.5">// HAKI ARSENAL</text>
    <text x="0" y="46" fill="#ffffff" font-size="25" class="sans" font-weight="800">Tech Stack &amp; Battle Gear</text>

    <!-- Category 1: Mobile Fleet -->
    <g transform="translate(0, 68)">
      <text x="0" y="14" fill="#38bdf8" font-size="12" class="mono" font-weight="700">📱 MOBILE FLEET</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#0284c7" stroke-width="1"/>
        <text x="42" y="18" text-anchor="middle" fill="#e0f2fe" font-size="11" class="sans" font-weight="600">Flutter</text>

        <rect x="95" y="0" width="70" height="28" rx="6" fill="#131726" stroke="#0284c7" stroke-width="1"/>
        <text x="130" y="18" text-anchor="middle" fill="#e0f2fe" font-size="11" class="sans" font-weight="600">Dart</text>

        <rect x="175" y="0" width="95" height="28" rx="6" fill="#131726" stroke="#0284c7" stroke-width="1"/>
        <text x="222" y="18" text-anchor="middle" fill="#e0f2fe" font-size="11" class="sans" font-weight="600">Firebase</text>

        <rect x="280" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#0284c7" stroke-width="1"/>
        <text x="322" y="18" text-anchor="middle" fill="#e0f2fe" font-size="11" class="sans" font-weight="600">Android</text>

        <rect x="375" y="0" width="95" height="28" rx="6" fill="#131726" stroke="#0284c7" stroke-width="1"/>
        <text x="422" y="18" text-anchor="middle" fill="#e0f2fe" font-size="11" class="sans" font-weight="600">REST APIs</text>
      </g>
    </g>

    <!-- Category 2: Frontend & Web -->
    <g transform="translate(0, 148)">
      <text x="0" y="14" fill="#fbbf24" font-size="12" class="mono" font-weight="700">⚡ FRONTEND &amp; WEB ARSENAL</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#d97706" stroke-width="1"/>
        <text x="42" y="18" text-anchor="middle" fill="#fef3c7" font-size="11" class="sans" font-weight="600">React.js</text>

        <rect x="95" y="0" width="80" height="28" rx="6" fill="#131726" stroke="#d97706" stroke-width="1"/>
        <text x="135" y="18" text-anchor="middle" fill="#fef3c7" font-size="11" class="sans" font-weight="600">Next.js</text>

        <rect x="185" y="0" width="100" height="28" rx="6" fill="#131726" stroke="#d97706" stroke-width="1"/>
        <text x="235" y="18" text-anchor="middle" fill="#fef3c7" font-size="11" class="sans" font-weight="600">TypeScript</text>

        <rect x="295" y="0" width="100" height="28" rx="6" fill="#131726" stroke="#d97706" stroke-width="1"/>
        <text x="345" y="18" text-anchor="middle" fill="#fef3c7" font-size="11" class="sans" font-weight="600">JavaScript</text>

        <rect x="405" y="0" width="75" height="28" rx="6" fill="#131726" stroke="#d97706" stroke-width="1"/>
        <text x="442" y="18" text-anchor="middle" fill="#fef3c7" font-size="11" class="sans" font-weight="600">Tailwind</text>
      </g>
    </g>

    <!-- Category 3: AI & Voice Intelligence -->
    <g transform="translate(0, 228)">
      <text x="0" y="14" fill="#c084fc" font-size="12" class="mono" font-weight="700">🤖 AI &amp; VOICE AGENT ENGINES</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#7e22ce" stroke-width="1"/>
        <text x="42" y="18" text-anchor="middle" fill="#f3e8ff" font-size="11" class="sans" font-weight="600">Python</text>

        <rect x="95" y="0" width="95" height="28" rx="6" fill="#131726" stroke="#7e22ce" stroke-width="1"/>
        <text x="142" y="18" text-anchor="middle" fill="#f3e8ff" font-size="11" class="sans" font-weight="600">LiveKit AI</text>

        <rect x="200" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#7e22ce" stroke-width="1"/>
        <text x="242" y="18" text-anchor="middle" fill="#f3e8ff" font-size="11" class="sans" font-weight="600">Groq LLM</text>

        <rect x="295" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#7e22ce" stroke-width="1"/>
        <text x="337" y="18" text-anchor="middle" fill="#f3e8ff" font-size="11" class="sans" font-weight="600">Node.js</text>

        <rect x="390" y="0" width="90" height="28" rx="6" fill="#131726" stroke="#7e22ce" stroke-width="1"/>
        <text x="435" y="18" text-anchor="middle" fill="#f3e8ff" font-size="11" class="sans" font-weight="600">FastAPI</text>
      </g>
    </g>

    <!-- Category 4: Core & Systems -->
    <g transform="translate(0, 308)">
      <text x="0" y="14" fill="#f43f5e" font-size="12" class="mono" font-weight="700">⚙️ SYSTEMS &amp; SHIP TOOLS</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="70" height="28" rx="6" fill="#131726" stroke="#be123c" stroke-width="1"/>
        <text x="35" y="18" text-anchor="middle" fill="#ffe4e6" font-size="11" class="sans" font-weight="600">Java</text>

        <rect x="80" y="0" width="105" height="28" rx="6" fill="#131726" stroke="#be123c" stroke-width="1"/>
        <text x="132" y="18" text-anchor="middle" fill="#ffe4e6" font-size="11" class="sans" font-weight="600">OOP Engines</text>

        <rect x="195" y="0" width="60" height="28" rx="6" fill="#131726" stroke="#be123c" stroke-width="1"/>
        <text x="225" y="18" text-anchor="middle" fill="#ffe4e6" font-size="11" class="sans" font-weight="600">Git</text>

        <rect x="265" y="0" width="85" height="28" rx="6" fill="#131726" stroke="#be123c" stroke-width="1"/>
        <text x="307" y="18" text-anchor="middle" fill="#ffe4e6" font-size="11" class="sans" font-weight="600">GitHub</text>

        <rect x="360" y="0" width="75" height="28" rx="6" fill="#131726" stroke="#be123c" stroke-width="1"/>
        <text x="397" y="18" text-anchor="middle" fill="#ffe4e6" font-size="11" class="sans" font-weight="600">Vercel</text>
      </g>
    </g>
  </g>
</svg>